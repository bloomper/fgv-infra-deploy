name: fgv-infra-${DEPLOY_ENV:?DEPLOY_ENV must be set in .env}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  keycloak-mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_DATABASE: ${KEYCLOAK_MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/KEYCLOAK_MYSQL_ROOT_PASSWORD
      MYSQL_USER: ${KEYCLOAK_MYSQL_USER}
      MYSQL_PASSWORD_FILE: /run/secrets/KEYCLOAK_MYSQL_USER_PASSWORD
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - keycloak_mysql_data:/var/lib/mysql
    secrets:
      - KEYCLOAK_MYSQL_ROOT_PASSWORD
      - KEYCLOAK_MYSQL_USER_PASSWORD

  keycloak-server:
    image: ${KEYCLOAK_IMAGE:?KEYCLOAK_IMAGE must be set in .env}
    entrypoint:
      - /bin/bash
      - -c
      - |
        export KC_DB_PASSWORD=$$(cat /run/secrets/KEYCLOAK_MYSQL_USER_PASSWORD)
        export KC_BOOTSTRAP_ADMIN_PASSWORD=$$(cat /run/secrets/KEYCLOAK_ADMIN_PASSWORD)
        export SMTP_PASSWORD=$$(cat /run/secrets/SMTP_PASSWORD)
        export KC_SPI_FORM_ACTION__FGV_TURNSTILE__SECRET_KEY=$$(cat /run/secrets/TURNSTILE_SECRET_KEY)
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_HOSTNAME: https://${KEYCLOAK_HOST}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: true
      KC_HTTP_ENABLED: true
      KC_HTTP_PORT: 8080
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_LOG_LEVEL: info
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-mysql/${KEYCLOAK_MYSQL_DATABASE}
      KC_DB_USERNAME: ${KEYCLOAK_MYSQL_USER}
      KC_SPI_EVENTS_LISTENER__FGV_ADMIN_NOTIFICATION__RECIPIENTS: ${ADMIN_NOTIFICATION_RECIPIENTS}
      KC_SPI_FORM_ACTION__FGV_TURNSTILE__SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      # The realm's clients, read by fgv.json when the realm is imported
      SPEXREGISTER_NAME: ${SPEXREGISTER_NAME:-Spexregister}
      SPEXREGISTER_URL: https://${SPEXREGISTER_WEB_HOST:?SPEXREGISTER_WEB_HOST must be set in .env}
      SPEXREGISTER_MCP_URL: https://${SPEXREGISTER_API_HOST:?SPEXREGISTER_API_HOST must be set in .env}/api/mcp
      FGV_REVIVAL_NAME: ${FGV_REVIVAL_NAME:-Nyuppsättning}
      FGV_REVIVAL_URL: https://${FGV_REVIVAL_WEB_HOST:?FGV_REVIVAL_WEB_HOST must be set in .env}
      FGV_REVIVAL_MCP_URL: https://${FGV_REVIVAL_API_HOST:?FGV_REVIVAL_API_HOST must be set in .env}/api/mcp
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${MAIL_FROM}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;printf \"GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      keycloak-mysql:
        condition: service_healthy
    networks:
      - default
      - fgv
    secrets:
      - KEYCLOAK_MYSQL_USER_PASSWORD
      - KEYCLOAK_ADMIN_PASSWORD
      - SMTP_PASSWORD
      - TURNSTILE_SECRET_KEY

volumes:
  keycloak_mysql_data:

networks:
  # Shared with spexregister-deploy and fgv-revival-deploy, whose API containers reach Keycloak as
  # keycloak-server:8080
  fgv:
    name: fgv-${DEPLOY_ENV}

secrets:
  KEYCLOAK_MYSQL_ROOT_PASSWORD:
    file: ./secrets/KEYCLOAK_MYSQL_ROOT_PASSWORD
  KEYCLOAK_MYSQL_USER_PASSWORD:
    file: ./secrets/KEYCLOAK_MYSQL_USER_PASSWORD
  KEYCLOAK_ADMIN_PASSWORD:
    file: ./secrets/KEYCLOAK_ADMIN_PASSWORD
  SMTP_PASSWORD:
    file: ./secrets/SMTP_PASSWORD
  TURNSTILE_SECRET_KEY:
    file: ./secrets/TURNSTILE_SECRET_KEY
